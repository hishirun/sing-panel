name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: pip install -r requirements.txt pytest httpx
      - name: Build statistics-enabled sing-box
        run: |
          go mod download github.com/sagernet/sing-box@v1.14.3
          cp -a "$(go env GOPATH)/pkg/mod/github.com/sagernet/sing-box@v1.14.3" /tmp/sing-box-build
          chmod -R u+w /tmp/sing-box-build
          cd /tmp/sing-box-build
          git apply "$GITHUB_WORKSPACE/core-patches/connection-user.patch"
          go build -tags with_quic,with_utls,with_v2ray_api,with_clash_api -o "$(go env GOPATH)/bin/sing-box" ./cmd/sing-box
      - name: Unit and real protocol integration tests
        run: SING_BOX="$(go env GOPATH)/bin/sing-box" python -m pytest -q
