services:
  panel:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      PANEL_PUBLIC_HOST: ${PANEL_PUBLIC_HOST:?Set PANEL_PUBLIC_HOST in .env}
      PANEL_SECURE_COOKIE: ${PANEL_SECURE_COOKIE:-0}
      PANEL_STATS_PORT: 19090
    volumes:
      - panel-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18889/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  panel-data:
