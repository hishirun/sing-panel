{% extends 'base.html' %}{% block content %}<div class="login"><h1>欢迎回来</h1><p class="muted">登录你的节点控制台</p><section>{% if notice %}<p class="muted" role="status">{{ notice }}</p>{% endif %}{% if error %}<p class="bad">{{ error }}</p>{% endif %}<form method="post" action="{{ admin_path }}/login"><input type="hidden" name="token" value="{{ csrf }}"><div class="admin-credential-fields"><label>管理员账号<input type="text" name="username" value="{{ login_username|default('', true) }}" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" {% if not login_username|default('', true) %}autofocus{% endif %}></label><label>登录密码<input type="password" name="password" autocomplete="current-password" required {% if login_username|default('', true) %}autofocus{% endif %} maxlength="1024"></label></div><div class="actions"><button class="primary">登录控制台 →</button></div></form></section></div>{% endblock %}
