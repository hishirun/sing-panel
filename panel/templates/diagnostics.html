{% extends 'base.html' %}{% block content %}
<header class="diagnostic-heading"><div><h1>实时监控与日志</h1><p class="muted">机器状态 · 核心日志</p></div><a class="button" href="{{ admin_path }}/servers">返回服务器</a></header>
<form method="get" class="diagnostic-toolbar"><label>选择服务器<select name="server"><option value="local" {{ 'selected' if selected=='local' else '' }}>主控本机</option>{% for s in servers %}<option value="{{ s.id }}" {{ 'selected' if selected==s.id else '' }}>{{ s.name }}</option>{% endfor %}</select></label><button class="primary">查看</button></form>
<div id="diagnostic-panel" data-url="{{ admin_path }}/system/live?server={{ selected|urlencode }}">
<div class="diagnostic-status"><span class="pill" data-live="connection" role="status">正在连接</span><span data-live="status">等待采样</span><small data-live="updated"></small></div>
<div class="diagnostic-metrics">{% for key,label in [('cpu','CPU'),('memory','内存'),('disk','磁盘'),('network','实时网速'),('total','网卡累计流量')] %}<article class="card"><span class="muted">{{ label }}</span><strong data-live="{{ key }}">—</strong></article>{% endfor %}</div><p class="bad" data-live="error"></p>
<section class="diagnostic-logs"><div class="rowhead"><h2>核心日志</h2><div class="actions"><button type="button" data-log-pause aria-pressed="false">暂停更新</button><button type="button" data-log-copy>复制日志</button></div></div><div class="diagnostic-toolbar"><label>搜索<input type="search" data-log-search placeholder="搜索日志内容" maxlength="200"></label><label>级别<select data-log-level><option value="">全部级别</option><option value="error">ERROR</option><option value="warn">WARN</option><option value="info">INFO</option><option value="debug">DEBUG</option></select></label></div><pre tabindex="0" aria-label="最近核心日志">正在获取日志…</pre><small class="muted">仅保留最近日志；远端日志需新版 Agent 上报。</small></section>
</div><script src="{{ asset_url('live.js') }}" defer></script><script src="{{ asset_url('diagnostics.js') }}" defer></script>{% endblock %}
