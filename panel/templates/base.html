<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ branding.brand }} · 节点与订阅</title><link rel="icon" href="{{ asset_url('shiro.png') }}"><link rel="stylesheet" href="{{ asset_url('panel.css') }}"><link rel="stylesheet" href="{{ asset_url('admin-soft.css') }}"><link rel="stylesheet" href="{{ asset_url('fleet.css') }}"><body data-page-select-src="{{ asset_url('select.js') }}" class="{{ 'admin-shell ' if request.session.get('admin') and not request.url.path.startswith('/s/') else '' }}theme-{{ branding.theme }}"><script src="{{ asset_url('theme.js') }}"></script><script src="{{ asset_url('feedback.js') }}"></script><script src="{{ asset_url('page-scripts.js') }}"></script><script src="{{ asset_url('navigation.js') }}"></script><main><div class="topbar"><div class="site-brand"><img src="{{ asset_url('shiro.png') }}" alt="蜡笔小新 · 小白">{{ branding.brand }}</div>{% if request.session.get('admin') and not request.url.path.startswith('/s/') %}<nav class="admin-nav"><a href="{{ admin_path }}/" class="{{ 'current' if request.url.path=='/' else '' }}">概览</a><a href="{{ admin_path }}/servers" class="{{ 'current' if request.url.path.startswith('/servers') else '' }}">服务器</a><a href="{{ admin_path }}/users" class="{{ 'current' if request.url.path.startswith('/users') else '' }}">用户管理</a><a href="{{ admin_path }}/nodes" class="{{ 'current' if request.url.path.startswith('/nodes') else '' }}">节点管理</a><a href="{{ admin_path }}/routing" class="{{ 'current' if request.url.path.startswith('/routing') else '' }}">分流管理</a><a href="{{ admin_path }}/settings" class="{{ 'current' if request.url.path=='/settings' else '' }}">系统设置</a><a href="{{ admin_path }}/system/status" class="{{ 'current' if request.url.path.startswith('/system') else '' }}">运行与维护</a></nav>{% endif %}<details class="theme-menu" id="theme-menu"><summary aria-label="切换外观主题"><span id="theme-current">外观主题</span><span class="theme-chevron" aria-hidden="true">⌄</span></summary><div class="theme-options"><span class="theme-caption">选择外观</span><button type="button" data-theme="dark"><span class="theme-swatch swatch-dark"></span>深色<span class="theme-check">✓</span></button><button type="button" data-theme="glass"><span class="theme-swatch swatch-glass"></span>浅色玻璃<span class="theme-check">✓</span></button><button type="button" data-theme="retro"><span class="theme-swatch swatch-retro"></span>暖橙复古<span class="theme-check">✓</span></button></div></details></div><div id="admin-content" {% if request.session.get('admin') and not request.url.path.startswith('/s/') %}data-admin="{{ admin_path }}"{% endif %}>{% block content %}{% endblock %}</div><footer>{{ branding.brand }} · UTC 流量统计</footer></main><script src="{{ asset_url('select.js') }}" defer></script></body></html>
