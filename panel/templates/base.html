<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ branding.brand }} · 节点与订阅</title><link rel="icon" href="/static/logo.png"><link rel="stylesheet" href="/static/panel.css?v=20261011-6"><body class="theme-{{ branding.theme }}"><script src="/static/theme.js?v=1"></script><main><div class="topbar">{% if request.session.get('admin') and not request.url.path.startswith('/s/') %}<nav class="admin-nav"><a href="{{ admin_path }}/" class="{{ 'current' if request.url.path=='/' else '' }}">概览</a><a href="{{ admin_path }}/users" class="{{ 'current' if request.url.path.startswith('/users') else '' }}">用户管理</a><a href="{{ admin_path }}/nodes" class="{{ 'current' if request.url.path.startswith('/nodes') else '' }}">节点管理</a><a href="{{ admin_path }}/settings" class="{{ 'current' if request.url.path=='/settings' else '' }}">系统设置</a><a href="{{ admin_path }}/system/status" class="{{ 'current' if request.url.path.startswith('/system') else '' }}">运行与维护</a></nav>{% endif %}<label class="theme-picker"><span aria-hidden="true">◐</span><select aria-label="切换外观主题" id="theme-picker"><option value="dark">深色</option><option value="glass">浅色玻璃</option><option value="retro">暖橙复古</option></select></label></div>{% block content %}{% endblock %}<footer>sing-panel · sing-box 原生统计 · 应用层上传 + 下载 · UTC 日结</footer></main></body></html>
