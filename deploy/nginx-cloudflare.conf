map $http_x_forwarded_proto $panel_scheme {
    default http;
    https https;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;
    include /etc/nginx/snippets/sing-panel-cf-allow.conf;
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    location / {
        if ($panel_scheme = http) { return 301 https://panel.example.com$request_uri; }
        proxy_pass http://127.0.0.1:18889;
        proxy_set_header Host panel.example.com;
        proxy_set_header X-Forwarded-Proto $panel_scheme;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_hide_header Server;
        proxy_cookie_flags session secure;
    }
}
